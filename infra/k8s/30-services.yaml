# The nine ApprovalFlow workloads. Dapr sidecars are injected by annotation;
# mcp-server and ui run without one by design (ADR-0008 / static content).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: approvalflow
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "gateway"
        dapr.io/app-port: "8000"
        dapr.io/config: "approvalflow-config"
    spec:
      imagePullSecrets: [{ name: ghcr-creds }]
      containers:
        - name: gateway
          image: ghcr.io/razdahan34/approvalflow-gateway:latest
          ports: [{ containerPort: 8000 }]
          env:
            - { name: SERVICE_NAME, value: gateway }
            - { name: GATEWAY_RATE_LIMIT, value: "300/minute" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: approvalflow-secrets, key: jwt-secret } }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: approvalflow
spec:
  # LoadBalancer works out of the box on Docker Desktop; use NodePort on kind.
  type: LoadBalancer
  selector: { app: gateway }
  ports: [{ port: 8080, targetPort: 8000 }]
---
