apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-decision
  namespace: approvalflow
spec:
  replicas: 1
  selector: { matchLabels: { app: ai-decision } }
  template:
    metadata:
      labels: { app: ai-decision }
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "ai-decision"
        dapr.io/app-port: "8000"
        dapr.io/config: "approvalflow-config"
    spec:
      imagePullSecrets: [{ name: ghcr-creds }]
      containers:
        - name: ai-decision
          image: ghcr.io/razdahan34/approvalflow-ai-decision:latest
          ports: [{ containerPort: 8000 }]
          env:
            - { name: SERVICE_NAME, value: ai-decision }
            - { name: POLICY_PATH, value: /app/policy/policy.md }
            - { name: MCP_SERVER_URL, value: "http://mcp-server.approvalflow:8000/mcp" }
            - name: LLM_PROVIDER
              valueFrom: { secretKeyRef: { name: approvalflow-secrets, key: llm-provider, optional: true } }
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: approvalflow-secrets, key: llm-api-key, optional: true } }
          volumeMounts:
            - { name: policy, mountPath: /app/policy, readOnly: true }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
      volumes:
        - name: policy
          configMap: { name: policy-doc }
---
