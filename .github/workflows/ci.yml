name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint + import order)
        run: ruff check .

      - name: Pytest (unit + integration)
        run: pytest tests/unit tests/integration -q

      - name: Eval harness (fixtures -> agent -> router)
        run: python eval/run_eval.py

  # ── CD (N2): on green main, build & publish every image — no manual release step ──
  publish:
    name: Publish images (${{ matrix.name }})
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, context: ., dockerfile: services/gateway/Dockerfile }
          - { name: intake, context: ., dockerfile: services/intake/Dockerfile }
          - { name: orchestrator, context: ., dockerfile: services/orchestrator/Dockerfile }
          - { name: ai-decision, context: ., dockerfile: services/ai-decision/Dockerfile }
          - { name: payment, context: ., dockerfile: services/payment/Dockerfile }
          - { name: notification, context: ., dockerfile: services/notification/Dockerfile }
          - { name: audit, context: ., dockerfile: services/audit/Dockerfile }
          - { name: mcp-server, context: ., dockerfile: services/mcp-server/Dockerfile }
          - { name: ui, context: ./ui, dockerfile: ./ui/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR only accepts lowercase repository names; github.repository keeps the
      # account's original casing.
      - name: Compute lowercase image base
        id: img
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.img.outputs.base }}-${{ matrix.name }}:latest
            ${{ steps.img.outputs.base }}-${{ matrix.name }}:${{ github.sha }}
