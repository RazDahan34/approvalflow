<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApprovalFlow</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8;
            --accent:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { padding:20px 28px; border-bottom:1px solid var(--line); }
    header h1 { margin:0; font-size:20px; } header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    main { max-width:900px; margin:24px auto; padding:0 20px; display:grid; gap:20px;
           grid-template-columns:1fr 1fr; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
    .card h2 { margin:0 0 12px; font-size:15px; color:var(--accent); }
    label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
    textarea, input { width:100%; background:#0b1220; color:var(--text); border:1px solid var(--line);
                      border-radius:8px; padding:10px; font-family:ui-monospace, monospace; font-size:12px; }
    textarea { height:230px; resize:vertical; }
    button { margin-top:12px; background:var(--accent); color:#04283a; border:none; border-radius:8px;
             padding:10px 16px; font-weight:600; cursor:pointer; }
    button:hover { filter:brightness(1.08); }
    pre { background:#0b1220; border:1px solid var(--line); border-radius:8px; padding:12px;
          font-size:12px; white-space:pre-wrap; word-break:break-word; min-height:40px; margin-top:12px; }
    .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }
    .full { grid-column:1 / -1; }
    code { color:var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>ApprovalFlow</h1>
    <p>Submit an invoice/expense and follow its decision. API gateway: <code id="api"></code></p>
  </header>
  <main>
    <section class="card">
      <h2>1 · Submit</h2>
      <label>Invoice JSON</label>
      <textarea id="payload"></textarea>
      <button onclick="submitInvoice()">Submit →</button>
      <pre id="submitOut">—</pre>
    </section>

    <section class="card">
      <h2>2 · Track status</h2>
      <label>Tracking id</label>
      <input id="tid" placeholder="paste a tracking id" />
      <button onclick="checkStatus()">Check status</button>
      <pre id="statusOut">—</pre>
    </section>
  </main>

  <script>
    const API = "http://localhost:8080";
    document.getElementById("api").textContent = API;

    const sample = {
      submitter: "dana.cohen@northwind.example", department: "engineering-2026Q2",
      vendor: "Bistro 19", vendorKnown: true, invoiceNumber: "NW-INV-7781",
      currency: "USD", category: "meals", attendees: 1,
      lineItems: [{ description: "Team lunch", quantity: 1, unitPrice: 38.89 }],
      taxAmount: 3.11, total: 42.0, receiptPresent: true, date: "2026-05-12",
      notes: "Solo working lunch."
    };
    document.getElementById("payload").value = JSON.stringify(sample, null, 2);

    async function submitInvoice() {
      const out = document.getElementById("submitOut");
      out.textContent = "submitting…";
      try {
        const body = document.getElementById("payload").value;
        const r = await fetch(API + "/invoices", {
          method: "POST", headers: { "Content-Type": "application/json" }, body
        });
        const data = await r.json();
        out.textContent = "HTTP " + r.status + "\n" + JSON.stringify(data, null, 2);
        if (data.trackingId) document.getElementById("tid").value = data.trackingId;
      } catch (e) { out.textContent = "error: " + e; }
    }

    async function checkStatus() {
      const out = document.getElementById("statusOut");
      const tid = document.getElementById("tid").value.trim();
      if (!tid) { out.textContent = "enter a tracking id first"; return; }
      out.textContent = "checking…";
      try {
        const r = await fetch(API + "/invoices/" + tid + "/status");
        const data = await r.json();
        out.textContent = "HTTP " + r.status + "\n" + JSON.stringify(data, null, 2);
      } catch (e) { out.textContent = "error: " + e; }
    }
  </script>
</body>
</html>
