apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore-payment
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis:6379
    - name: redisPassword
      value: ""
# Database-per-service (ADR-0009): only payment may load this store; the default
# app-id key prefix isolates its keyspace on the shared Redis instance.
scopes:
  - payment
