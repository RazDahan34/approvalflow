apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis:6379
    - name: redisPassword
      value: ""
    # Same store backs Dapr Workflow (which uses actors) in Phase 3.
    - name: actorStateStore
      value: "true"
    # Shared, un-prefixed keyspace so a status projection written by one service
    # can be read by another. Each record is explicitly namespaced (e.g. "status:<id>").
    - name: keyPrefix
      value: none
