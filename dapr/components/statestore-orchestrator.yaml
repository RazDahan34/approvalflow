apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore-orchestrator
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis:6379
    - name: redisPassword
      value: ""
    # Dapr Workflow runs on the actor runtime; this store persists workflow
    # histories, so a restart resumes exactly where the instance paused (M11).
    - name: actorStateStore
      value: "true"
scopes:
  - orchestrator
