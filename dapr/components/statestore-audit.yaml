apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore-audit
spec:
  # The audit trail lives on PostgreSQL — same Dapr state API, different backend,
  # swapped purely in YAML (ADR-0009). Demonstrates database-per-service for real.
  type: state.postgresql
  version: v2
  metadata:
    - name: connectionString
      value: "host=postgres user=approvalflow password=approvalflow dbname=approvalflow port=5432 sslmode=disable"
scopes:
  - audit
