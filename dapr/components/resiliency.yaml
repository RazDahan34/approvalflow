apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: approvalflow-resiliency
spec:
  # Declarative resilience (N3): every sidecar retries transient invocation failures
  # (e.g. a peer container being replaced) instead of surfacing them to callers.
  policies:
    retries:
      invocationRetry:
        policy: constant
        duration: 2s
        maxRetries: 3
    circuitBreakers:
      invocationCB:
        # Demonstrative breaker: opens only on a sustained outage (well beyond the
        # retry window) so patient retries during a restart are never cut short.
        maxRequests: 1
        timeout: 30s
        trip: consecutiveFailures > 30
  targets:
    apps:
      orchestrator:
        retry: invocationRetry
        circuitBreaker: invocationCB
      intake:
        retry: invocationRetry
        circuitBreaker: invocationCB
      payment:
        retry: invocationRetry
        circuitBreaker: invocationCB
      # ai-decision is deliberately NOT retried here: an agent error means "analyst
      # unavailable", and the orchestrator fail-closes to a human immediately. Retrying
      # a rate-limited LLM only burns quota and delays the safe fallback.
