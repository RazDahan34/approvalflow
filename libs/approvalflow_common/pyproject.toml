[project]
name = "approvalflow-common"
version = "0.1.0"
description = "Shared building blocks for ApprovalFlow services (logging, correlation, schemas, Dapr helpers)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "dapr>=1.14",
  "dapr-ext-fastapi>=1.14",
  "PyJWT>=2.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["approvalflow_common*"]
