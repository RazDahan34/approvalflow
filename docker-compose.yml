# ApprovalFlow — local stack. `docker compose up --build` brings up everything (M4).
# Each application service runs next to its own Dapr sidecar (daprd). The sidecar
# shares the app's network namespace (network_mode: service:<app>) so the app reaches
# Dapr on localhost, while the sidecar reaches redis/zipkin/placement by service name.

name: approvalflow

services:
  # ───────────────────────── Infrastructure ─────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [approvalflow]

  zipkin:
    image: openzipkin/zipkin:3
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks: [approvalflow]

  # Scrapes every sidecar's built-in metrics endpoint (N4).
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    networks: [approvalflow]

  placement:
    image: daprio/dapr:1.18.1
    command: ["./placement", "-port", "50006"]
    restart: unless-stopped
    networks: [approvalflow]

  # One-shot: seed the live autonomy posture into the configuration store (M13/F7).
  # Values match ADR-0006; change any of them at runtime with `redis-cli SET`.
  config-seed:
    image: redis:7-alpine
    command: >
      redis-cli -h redis MSET
      autonomy.ceiling_usd 500
      autonomy.confidence 0.80
      autonomy.tier.meals 250
      autonomy.tier.travel 500
      autonomy.tier.saas 200
      autonomy.tier.hardware 350
      autonomy.tier.other 100
    depends_on: [redis]
    restart: "no"
    networks: [approvalflow]

  # Dapr Workflow persists its timers/reminders through the Scheduler service.
  scheduler:
    image: daprio/dapr:1.18.1
    command: ["./scheduler", "--port", "50007", "--etcd-data-dir", "/data"]
    # The dapr image runs as a non-root user, but the named volume mounts root-owned;
    # local-dev only, so run the scheduler as root to let etcd create its data dir.
    user: root
    restart: unless-stopped
    volumes:
      - scheduler-data:/data
    networks: [approvalflow]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: approvalflow
      POSTGRES_PASSWORD: approvalflow
      POSTGRES_DB: approvalflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approvalflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [approvalflow]

  # ───────────────────────────── Intake ─────────────────────────────
  intake:
    build:
      context: .
      dockerfile: services/intake/Dockerfile
    environment:
      SERVICE_NAME: intake
      LOG_LEVEL: INFO
      STATESTORE_NAME: statestore-intake
    # No host port — the API gateway is the single external entry point (M6).
    depends_on: [redis]
    networks: [approvalflow]

  intake-dapr:
    image: daprio/daprd:1.18.1
    # Local-dev only: the shared name-resolution volume is root-owned (same story as
    # the scheduler's data dir), and daprd runs as non-root by default.
    user: root
    command:
      - "./daprd"
      - "-app-id"
      - "intake"
      - "-app-port"
      - "8000"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-resources-path"
      - "/components"
      - "-config"
      - "/config/config.yaml"
      - "-placement-host-address"
      - "placement:50006"
    volumes:
      - ./dapr/components:/components
      - ./dapr/config.yaml:/config/config.yaml
      - dapr-nr:/nameresolution
    depends_on: [intake, redis, placement]
    network_mode: "service:intake"

  # ─────────────────────────── Orchestrator ─────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
      SERVICE_NAME: orchestrator
      LOG_LEVEL: INFO
      STATESTORE_NAME: statestore-orchestrator
      AUTONOMY_CEILING_USD: ${AUTONOMY_CEILING_USD:-500}
      AUTONOMY_CONFIDENCE: ${AUTONOMY_CONFIDENCE:-0.80}
    depends_on: [redis, placement]
    networks: [approvalflow]

  orchestrator-dapr:
    image: daprio/daprd:1.18.1
    # Local-dev only: the shared name-resolution volume is root-owned (same story as
    # the scheduler's data dir), and daprd runs as non-root by default.
    user: root
    command:
      - "./daprd"
      - "-app-id"
      - "orchestrator"
      - "-app-port"
      - "8000"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-resources-path"
      - "/components"
      - "-config"
      - "/config/config.yaml"
      - "-placement-host-address"
      - "placement:50006"
      - "-scheduler-host-address"
      - "scheduler:50007"
    volumes:
      - ./dapr/components:/components
      - ./dapr/config.yaml:/config/config.yaml
      - dapr-nr:/nameresolution
    depends_on: [orchestrator, redis, placement, scheduler]
    network_mode: "service:orchestrator"

  # ─────────────────────────── AI-Decision ──────────────────────────
  ai-decision:
    build:
      context: .
      dockerfile: services/ai-decision/Dockerfile
    environment:
      SERVICE_NAME: ai-decision
      LOG_LEVEL: INFO
      # Swappable provider (M15): stub runs offline; set gemini/groq/openrouter + a key
      # in .env for a real model. Compose passes the values straight through.
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      POLICY_PATH: /app/policy.md
      MCP_SERVER_URL: http://mcp-server:8000/mcp
    volumes:
      # RAG source (N5): mounted, so a policy edit needs a restart, not a rebuild (F7).
      - ./policy.md:/app/policy.md:ro
    depends_on: [redis, mcp-server]
    networks: [approvalflow]

  # ───────────────────────────── Payment ────────────────────────────
  payment:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    environment:
      SERVICE_NAME: payment
      LOG_LEVEL: INFO
      STATESTORE_NAME: statestore-payment
    depends_on: [redis]
    networks: [approvalflow]

  payment-dapr:
    image: daprio/daprd:1.18.1
    # Local-dev only: the shared name-resolution volume is root-owned (same story as
    # the scheduler's data dir), and daprd runs as non-root by default.
    user: root
    command:
      - "./daprd"
      - "-app-id"
      - "payment"
      - "-app-port"
      - "8000"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-resources-path"
      - "/components"
      - "-config"
      - "/config/config.yaml"
      - "-placement-host-address"
      - "placement:50006"
    volumes:
      - ./dapr/components:/components
      - ./dapr/config.yaml:/config/config.yaml
      - dapr-nr:/nameresolution
    depends_on: [payment, redis, placement]
    network_mode: "service:payment"

  # ─────────────────────────── MCP server (B2) ──────────────────────
  # The agent's tools over the Model Context Protocol. Internal-only (no host port,
  # no Dapr sidecar): MCP *is* the transport here, and it stays on the tool plane —
  # see ADR-0008.
  mcp-server:
    build:
      context: .
      dockerfile: services/mcp-server/Dockerfile
    environment:
      SERVICE_NAME: mcp-server
      LOG_LEVEL: INFO
      POLICY_PATH: /app/policy.md
    volumes:
      - ./policy.md:/app/policy.md:ro
    networks: [approvalflow]

  ai-decision-dapr:
    image: daprio/daprd:1.18.1
    # Local-dev only: the shared name-resolution volume is root-owned (same story as
    # the scheduler's data dir), and daprd runs as non-root by default.
    user: root
    command:
      - "./daprd"
      - "-app-id"
      - "ai-decision"
      - "-app-port"
      - "8000"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-resources-path"
      - "/components"
      - "-config"
      - "/config/config.yaml"
      - "-placement-host-address"
      - "placement:50006"
    volumes:
      - ./dapr/components:/components
      - ./dapr/config.yaml:/config/config.yaml
      - dapr-nr:/nameresolution
    depends_on: [ai-decision, redis, placement]
    network_mode: "service:ai-decision"

  # ───────────────────────────── Gateway ────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      SERVICE_NAME: gateway
      LOG_LEVEL: INFO
      GATEWAY_RATE_LIMIT: ${GATEWAY_RATE_LIMIT:-300/minute}
    ports:
      - "8080:8000" # the ONLY external entry point
    depends_on: [redis]
    networks: [approvalflow]

  gateway-dapr:
    image: daprio/daprd:1.18.1
    # Local-dev only: the shared name-resolution volume is root-owned (same story as
    # the scheduler's data dir), and daprd runs as non-root by default.
    user: root
    command:
      - "./daprd"
      - "-app-id"
      - "gateway"
      - "-app-port"
      - "8000"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-resources-path"
      - "/components"
      - "-config"
      - "/config/config.yaml"
      - "-placement-host-address"
      - "placement:50006"
    volumes:
      - ./dapr/components:/components
      - ./dapr/config.yaml:/config/config.yaml
      - dapr-nr:/nameresolution
    depends_on: [gateway, redis, placement]
    network_mode: "service:gateway"

  # ──────────────────────────── Notification ────────────────────────
  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      SERVICE_NAME: notification
      LOG_LEVEL: INFO
    depends_on: [redis]
    networks: [approvalflow]

  notification-dapr:
    image: daprio/daprd:1.18.1
    # Local-dev only: the shared name-resolution volume is root-owned (same story as
    # the scheduler's data dir), and daprd runs as non-root by default.
    user: root
    command:
      - "./daprd"
      - "-app-id"
      - "notification"
      - "-app-port"
      - "8000"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-resources-path"
      - "/components"
      - "-config"
      - "/config/config.yaml"
      - "-placement-host-address"
      - "placement:50006"
    volumes:
      - ./dapr/components:/components
      - ./dapr/config.yaml:/config/config.yaml
      - dapr-nr:/nameresolution
    depends_on: [notification, redis, placement]
    network_mode: "service:notification"

  # ─────────────────────────────── Audit ────────────────────────────
  audit:
    build:
      context: .
      dockerfile: services/audit/Dockerfile
    environment:
      SERVICE_NAME: audit
      LOG_LEVEL: INFO
      STATESTORE_NAME: statestore-audit # postgres-backed component (ADR-0009)
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks: [approvalflow]

  audit-dapr:
    image: daprio/daprd:1.18.1
    # Local-dev only: the shared name-resolution volume is root-owned (same story as
    # the scheduler's data dir), and daprd runs as non-root by default.
    user: root
    command:
      - "./daprd"
      - "-app-id"
      - "audit"
      - "-app-port"
      - "8000"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-resources-path"
      - "/components"
      - "-config"
      - "/config/config.yaml"
      - "-placement-host-address"
      - "placement:50006"
    volumes:
      - ./dapr/components:/components
      - ./dapr/config.yaml:/config/config.yaml
      - dapr-nr:/nameresolution
    depends_on: [audit, redis, placement, postgres]
    network_mode: "service:audit"

  # ─────────────────────────────── UI ───────────────────────────────
  ui:
    build:
      context: ./ui
    ports:
      - "3000:80"
    depends_on: [gateway]
    networks: [approvalflow]

networks:
  approvalflow:

volumes:
  pgdata:
  scheduler-data:
  # Shared registry for Dapr's sqlite name-resolution (see dapr/config.yaml).
  dapr-nr:


